name: ci

on:
  pull_request:
  push:
    branches: [main]

# Read-only token: a bot-authored branch must not be able to write anything back.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # Same database the factory gives each run, so tests that pass there pass here.
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U app"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: 'postgresql://app:app@127.0.0.1:5432/app?serverVersion=16&charset=utf8'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: pdo_pgsql
      - run: composer install --no-interaction --no-progress
      - run: composer test
