name: ci

on:
  pull_request:
  push:
    branches: [main]

# Read-only token: a bot-authored branch must not be able to write anything back.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: composer test
